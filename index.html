<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24306B">
<title>POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#24306B; --indigo-2:#3A4890; --paper:#F5F6FA; --card:#FFFFFF;
    --ink:#1B2030; --muted:#6B7186; --line:#E2E4EE; --marigold:#E8A317;
    --marigold-ink:#3B2A00; --ok:#2E7D5B; --bad:#B3261E; --tag:#FFF6E0;
    --r-sm:8px; --r-md:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font:16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* header */
  header{position:sticky;top:0;z-index:5;background:var(--indigo);color:#fff;padding:12px 16px 0}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .shop{font-weight:800;font-size:18px;letter-spacing:-.01em}
  .who{font-size:13px;opacity:.8;background:none;border:0;color:#fff;padding:4px 0}
  nav{display:flex;gap:4px;margin-top:10px}
  nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;padding:10px 0 12px;font-weight:600;
    border-bottom:3px solid transparent}
  nav button[aria-selected=true]{opacity:1;border-bottom-color:var(--marigold)}

  main{padding:12px 12px 120px;max-width:720px;margin:0 auto}

  /* search */
  .searchbar{display:flex;gap:8px;position:sticky;top:96px;z-index:4;background:var(--paper);padding:4px 0 8px}
  .searchbar input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:#fff}
  .btn-scan{border:0;border-radius:var(--r-md);background:var(--indigo);color:#fff;padding:0 16px;font-weight:600}
  .cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .cats button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
  .cats button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* product list */
  .prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
  .prod>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:none;border:0;padding:14px;text-align:left}
  .pname{font-weight:700}
  .pmeta{font-size:13px;color:var(--muted)}
  .pprice{font-weight:700;white-space:nowrap}
  .vars{padding:0 14px 14px}
  .colour{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
  .cname{width:72px;flex:none;font-size:14px;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:8px}

  /* size chips styled like swing tags: the memorable element */
  .tag{position:relative;min-width:58px;border:1.5px solid #D9B65C;background:var(--tag);
    border-radius:4px 10px 10px 4px;padding:6px 10px 6px 18px;text-align:left;line-height:1.1}
  .tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;
    border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px #D9B65C}
  .tag b{display:block;font-size:15px}
  .tag small{font-size:11px;color:var(--muted)}
  .tag.low small{color:var(--bad);font-weight:600}
  .tag:disabled{opacity:.4;cursor:not-allowed}
  .tag.in-cart{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .tag.in-cart small{color:#C9CFF0}
  .tag.in-cart::before{background:var(--indigo-2);box-shadow:none}

  /* bottom bill bar */
  .billbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line)}
  .billbar button{width:100%;max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;
    border:0;border-radius:var(--r-md);background:var(--marigold);color:var(--marigold-ink);padding:14px 18px;font-weight:800;font-size:17px}
  .billbar button:disabled{background:var(--line);color:var(--muted)}

  /* sheets / overlays */
  .sheet{position:fixed;inset:0;z-index:10;background:var(--paper);overflow-y:auto;padding-bottom:110px}
  .sheet-head{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;gap:8px;
    padding:14px 12px;border-bottom:1px solid var(--line);z-index:2}
  .sheet-head h2{margin:0;font-size:18px;flex:1}
  .icon-btn{border:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}
  .wrap{max-width:720px;margin:0 auto;padding:12px}

  .line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:#fff;border:1px solid var(--line);
    border-radius:var(--r-md);padding:12px;margin-bottom:8px}
  .line .lt{font-weight:700;text-align:right}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{border:0;background:#fff;width:40px;height:36px;font-size:20px;font-weight:700}
  .stepper span{min-width:32px;text-align:center;font-weight:700}
  .line-actions{display:flex;gap:10px;align-items:center;grid-column:1/-1}
  .link{background:none;border:0;color:var(--indigo-2);font-weight:600;padding:6px 0}
  .link.danger{color:var(--bad)}

  .field{margin:14px 0}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;font-weight:600}
  .seg button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .totals{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-top:14px}
  .totals div{display:flex;justify-content:space-between;padding:3px 0}
  .totals .grand{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}

  /* receipt */
  .receipt{background:#fff;max-width:380px;margin:12px auto;padding:20px 18px;border-radius:4px;
    box-shadow:0 1px 0 var(--line),0 8px 24px rgba(36,48,107,.08);font-size:14px}
  .receipt h3{margin:0;text-align:center;font-size:18px}
  .receipt .c{text-align:center;color:var(--muted);font-size:12px}
  .receipt hr{border:0;border-top:1px dashed #BFC3D3;margin:10px 0}
  .receipt .row{display:flex;justify-content:space-between;gap:8px}
  .receipt .sub{color:var(--muted);font-size:12px}
  .receipt .big{font-size:18px;font-weight:800}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:380px;margin:0 auto}
  .actions button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-weight:700}
  .actions .primary{grid-column:1/-1;background:var(--marigold);border-color:var(--marigold);color:var(--marigold-ink)}

  /* today */
  .daytotal{background:var(--indigo);color:#fff;border-radius:var(--r-md);padding:16px;margin-bottom:10px}
  .daytotal .amt{font-size:32px;font-weight:800;letter-spacing:-.02em}
  .daytotal .sub{opacity:.8;font-size:14px}
  .modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .modes span{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px}
  .bill{width:100%;display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);
    border-radius:var(--r-md);padding:12px;margin-bottom:6px;text-align:left}
  .bill .neg{color:var(--bad)}

  /* login */
  .login{max-width:360px;margin:12vh auto 0;padding:0 20px}
  .login h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .login p{color:var(--muted);margin:0 0 20px}
  .login select,.login input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:14px;background:#fff;margin-bottom:10px}
  .login input{letter-spacing:.4em;text-align:center;font-size:22px}
  .login button{width:100%;border:0;border-radius:10px;background:var(--indigo);color:#fff;padding:14px;font-weight:700}

  .status{font-size:14px;color:var(--muted);margin:-8px 0 14px;white-space:pre-wrap}
  .status.err{color:var(--bad);background:#FBEAEA;border-radius:10px;padding:10px 12px;margin:0 0 14px}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:999px;font-size:14px;max-width:90vw}
  .toast.err{background:var(--bad)}
  .busy{position:fixed;inset:0;z-index:40;background:rgba(245,246,250,.7);display:flex;align-items:center;justify-content:center;font-weight:700}
  #scanner{width:100%;max-width:480px;margin:0 auto;border-radius:var(--r-md);overflow:hidden;background:#000}

  @media (prefers-reduced-motion:no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }
  @media print{
    body *{visibility:hidden} .receipt,.receipt *{visibility:visible}
    .receipt{position:absolute;left:0;top:0;box-shadow:none;margin:0;width:80mm;padding:0}
  }
</style>
</head>
<body>

<!-- Login -->
<section id="vLogin" class="login">
  <h1 id="loginShop">Sign in</h1>
  <p>Choose your name and enter your PIN.</p>
  <div id="status" class="status" role="alert">Loading…</div>
  <select id="loginUser" aria-label="User"></select>
  <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN" placeholder="••••">
  <button id="loginBtn">Sign in</button>
</section>

<!-- App shell -->
<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div class="shop" id="shopName"></div>
      <button class="who" id="whoBtn" title="Sign out"></button>
    </div>
    <nav role="tablist">
      <button role="tab" id="tabSell" aria-selected="true">Sell</button>
      <button role="tab" id="tabToday" aria-selected="false">Today</button>
    </nav>
  </header>

  <main id="vSell">
    <div class="searchbar">
      <input id="q" type="search" placeholder="Search name, SKU or barcode" autocomplete="off" enterkeyhint="search">
      <button class="btn-scan" id="scanBtn">Scan</button>
    </div>
    <div class="cats" id="cats"></div>
    <div id="plist"></div>
  </main>

  <main id="vToday" class="hidden"></main>

  <div class="billbar" id="billbar">
    <button id="reviewBtn" disabled><span id="bbCount">No items</span><span class="num" id="bbTotal">₹0</span></button>
  </div>
</div>

<!-- Bill sheet -->
<section id="vBill" class="sheet hidden" aria-label="Bill">
  <div class="sheet-head"><button class="icon-btn" id="billBack">Back</button><h2>Bill</h2>
    <button class="link danger" id="clearBill">Clear</button></div>
  <div class="wrap">
    <div id="lines"></div>
    <div class="field">
      <label>Payment</label>
      <div class="seg" id="payModes"></div>
    </div>
    <div class="field"><label for="billDisc">Bill discount (₹)</label>
      <input id="billDisc" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div class="field"><label for="custName">Customer name (optional)</label>
      <input id="custName" type="text" autocomplete="off"></div>
    <div class="field"><label for="custPhone">Customer mobile (optional, for WhatsApp bill)</label>
      <input id="custPhone" type="tel" inputmode="tel" autocomplete="off"></div>
    <div class="totals num" id="totals"></div>
  </div>
  <div class="billbar"><button id="completeBtn"><span>Complete sale</span><span class="num" id="cbTotal"></span></button></div>
</section>

<!-- Receipt -->
<section id="vReceipt" class="sheet hidden" aria-label="Receipt">
  <div class="sheet-head"><button class="icon-btn" id="rcptBack">Close</button><h2 id="rcptTitle">Bill saved</h2></div>
  <div class="wrap">
    <div class="receipt num" id="receipt"></div>
    <div class="actions">
      <button id="printBtn">Print</button>
      <button id="waBtn">Send on WhatsApp</button>
      <button class="primary" id="newSaleBtn">New sale</button>
    </div>
  </div>
</section>

<!-- Scanner -->
<section id="vScan" class="sheet hidden" aria-label="Scan barcode">
  <div class="sheet-head"><button class="icon-btn" id="scanClose">Done</button><h2>Scan items</h2></div>
  <div class="wrap">
    <div id="scanner"></div>
    <p class="empty" id="scanMsg">Point the camera at the barcode. Each scan adds one piece.</p>
  </div>
</section>

<div id="busy" class="busy hidden">Saving…</div>

<script>
window.POS_CONFIG = {
  API_URL: 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'
};
</script>
<script>
function showFatal(msg){
  var st = document.getElementById('status');
  document.getElementById('vLogin').classList.remove('hidden');
  if (st) { st.className = 'status err'; st.textContent = msg; }
}
window.addEventListener('error', function(e){ showFatal('Page error: ' + (e.message || e) + ' (line ' + e.lineno + ')'); });
window.addEventListener('unhandledrejection', function(e){ showFatal('Error: ' + ((e.reason && e.reason.message) || e.reason)); });
document.getElementById('status').textContent = 'Loading…';
setTimeout(function(){
  var st = document.getElementById('status');
  if (st && st.textContent === 'Loading…')
    showFatal('The page script did not start. Reload the page; if this repeats, re-upload index.html.');
}, 8000);
</script>
<script>
const $ = id => document.getElementById(id);
const NL = String.fromCharCode(10);
const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN', {maximumFractionDigits: 2});
const esc = s => {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML.split('"').join(String.fromCharCode(38) + 'quot;').split("'").join(String.fromCharCode(38) + '#39;');
};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};

const S = { token: store.get('pos.token'), user: null, shop: null, items: [], bySku: {},
            cart: [], cat: 'All', open: {}, payMode: 'UPI', lastReceipt: null };

async function call(fn, ...args){
  const url = window.POS_CONFIG.API_URL;
  if (!/^https?:/.test(url)) throw new Error('API_URL is not set. Edit index.html and paste your Apps Script web app URL.');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let data;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
      signal: ctrl.signal,
    });
    data = await res.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? 'The server took too long to reply. Check the internet connection and try again.'
      : 'Could not reach the server. Check the internet connection, and that the Apps Script deployment allows access to Anyone.');
  } finally { clearTimeout(timer); }
  if (!data.ok) {
    if (String(data.error).includes('SESSION_EXPIRED')) { signOut(true); throw new Error('Session expired. Sign in again.'); }
    throw new Error(data.error);
  }
  return data.result;
}
let toastTimer = null;
function toast(msg, isErr){
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), isErr ? 4000 : 1600);
}
function show(id, on){ $(id).classList.toggle('hidden', !on); }

async function boot(){
  const saved = store.get('pos.user');
  if (S.token && saved) {
    const s = JSON.parse(saved); S.user = s.user; S.shop = s.shop;
    try { await enterApp(); return; } catch(e){  }
  }
  showLogin();
}
async function showLogin(){
  show('app', false); show('vLogin', true);
  $('status').className = 'status'; $('status').textContent = 'Loading users…';
  let users;
  try { users = await call('listUsers'); }
  catch(e){ return showFatal(e.message || String(e)); }
  if (!users || !users.length) return showFatal('No users found. Add people to the Users tab, then set PINs from the POS menu in the sheet.');
  $('status').textContent = '';
  $('loginUser').innerHTML = users.map(u => `<option value="${esc(u.name)}">${esc(u.name)}</option>`).join('');
  const last = store.get('pos.lastEmail'); if (last) $('loginUser').value = last;
  $('loginPin').focus();
}
$('loginBtn').onclick = async () => {
  const email = $('loginUser').value, pin = $('loginPin').value;
  if (!pin) return toast('Enter your PIN', true);
  $('loginBtn').disabled = true;
  try {
    const r = await call('login', email, pin);
    S.token = r.token; S.user = r.user; S.shop = r.shop;
    store.set('pos.token', r.token); store.set('pos.user', JSON.stringify({user: r.user, shop: r.shop}));
    store.set('pos.lastEmail', email);
    $('loginPin').value = '';
    await enterApp();
  } catch(e){ toast(e.message, true); }
  $('loginBtn').disabled = false;
};
$('loginPin').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

function signOut(silent){
  if (S.token && !silent) call('logout', S.token).catch(() => {});
  S.token = null; store.del('pos.token'); store.del('pos.user');
  showLogin();
}
$('whoBtn').onclick = () => { if (confirm('Sign out?')) signOut(); };

async function enterApp(){
  $('shopName').textContent = S.shop.name;
  $('loginShop').textContent = S.shop.name;
  $('whoBtn').textContent = S.user.name + ' · Sign out';
  await loadCatalog();
  show('vLogin', false); show('app', true);
  renderBillBar();
}

async function loadCatalog(){
  const r = await call('getCatalog', S.token);
  S.items = r.items; S.bySku = {}; S.byCode = {};
  r.items.forEach(i => { S.bySku[i.sku] = i; S.byCode[i.sku.toUpperCase()] = i; if (i.barcode) S.byCode[i.barcode] = i; });
  renderCats(); renderList();
}
function renderCats(){
  const cats = ['All', ...new Set(S.items.map(i => i.category).filter(Boolean))];
  $('cats').innerHTML = cats.map(c => `<button aria-pressed="${c === S.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
$('cats').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.cat = b.dataset.cat; renderCats(); renderList(); };
$('q').addEventListener('input', renderList);
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const code = $('q').value.trim();
  const hit = S.byCode[code] || S.byCode[code.toUpperCase()];
  if (hit) { addToCart(hit.sku); $('q').value = ''; renderList(); }
});

function inCartQty(sku){ const l = S.cart.find(c => c.sku === sku); return l ? l.qty : 0; }

function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const groups = {};
  S.items.forEach(i => {
    if (S.cat !== 'All' && i.category !== S.cat) return;
    if (q && !(i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q) ||
               i.barcode.includes(q) || i.colour.toLowerCase().includes(q))) return;
    (groups[i.productId] = groups[i.productId] || []).push(i);
  });
  const ids = Object.keys(groups);
  if (!ids.length) { $('plist').innerHTML = `<div class="empty">No items match “${esc($('q').value)}”.<br>Check the spelling, or add the item in the Variants tab.</div>`; return; }
  $('plist').innerHTML = ids.map(pid => {
    const vs = groups[pid], p = vs[0];
    const open = q || S.open[pid] || ids.length === 1;
    const total = vs.reduce((s, v) => s + v.stock, 0);
    const prices = [...new Set(vs.map(v => v.price))];
    const colours = {};
    vs.forEach(v => (colours[v.colour] = colours[v.colour] || []).push(v));
    return `<div class="prod">
      <button data-toggle="${esc(pid)}" aria-expanded="${!!open}">
        <span><span class="pname">${esc(p.name)}</span><br><span class="pmeta">${total} in stock · ${Object.keys(colours).length} colour${Object.keys(colours).length > 1 ? 's' : ''}</span></span>
        <span class="pprice num">${prices.map(fmt).join(' / ')}</span>
      </button>
      ${open ? `<div class="vars">${Object.entries(colours).map(([c, list]) => `
        <div class="colour"><span class="cname">${esc(c)}</span><span class="tags">${list.map(v => {
          const left = v.stock - inCartQty(v.sku), inCart = inCartQty(v.sku);
          return `<button class="tag ${inCart ? 'in-cart' : ''} ${left <= 2 && left > 0 ? 'low' : ''}" data-sku="${esc(v.sku)}" ${left <= 0 && !S.shop.allowNegativeStock ? 'disabled' : ''}
             aria-label="${esc(p.name)} ${esc(c)} size ${esc(v.size)}, ${left} left">
             <b>${esc(v.size)}</b><small>${inCart ? inCart + ' in bill' : left <= 0 ? 'sold out' : left + ' left'}</small></button>`;
        }).join('')}</span></div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
$('plist').onclick = e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { const id = t.dataset.toggle; S.open[id] = !S.open[id]; renderList(); return; }
  const tag = e.target.closest('[data-sku]');
  if (tag && !tag.disabled) addToCart(tag.dataset.sku);
};

function addToCart(sku, silent){
  const it = S.bySku[sku]; if (!it) return false;
  const line = S.cart.find(c => c.sku === sku);
  const want = (line ? line.qty : 0) + 1;
  if (!S.shop.allowNegativeStock && want > it.stock) { toast(`Only ${it.stock} of ${it.name} ${it.colour} ${it.size} in stock`, true); return false; }
  if (line) line.qty++; else S.cart.push({ sku, qty: 1, lineDiscount: 0 });
  if (!silent) toast(`Added ${it.name} · ${it.colour} ${it.size}`);
  if (navigator.vibrate) navigator.vibrate(30);
  renderBillBar(); renderList();
  return true;
}
function cartTotals(){
  const sub = S.cart.reduce((s, l) => s + S.bySku[l.sku].price * l.qty - (l.lineDiscount || 0), 0);
  const bd = Math.max(0, Number($('billDisc').value) || 0);
  return { sub, bd, total: sub - bd, pcs: S.cart.reduce((s, l) => s + l.qty, 0) };
}
function renderBillBar(){
  const t = cartTotals();
  $('reviewBtn').disabled = !S.cart.length;
  $('bbCount').textContent = S.cart.length ? `Review bill · ${t.pcs} pc${t.pcs > 1 ? 's' : ''}` : 'No items';
  $('bbTotal').textContent = fmt(t.total);
}
$('reviewBtn').onclick = () => { renderBill(); show('vBill', true); };
$('billBack').onclick = () => { show('vBill', false); renderList(); };
$('clearBill').onclick = () => { if (S.cart.length && confirm('Remove all items from this bill?')) { resetBill(); show('vBill', false); } };

function renderBill(){
  $('lines').innerHTML = S.cart.map((l, i) => {
    const it = S.bySku[l.sku];
    return `<div class="line">
      <div><div class="pname">${esc(it.name)}</div><div class="pmeta">${esc(it.colour)} · ${esc(it.size)} · ${fmt(it.price)} each</div></div>
      <div class="lt num">${fmt(it.price * l.qty - l.lineDiscount)}${l.lineDiscount ? `<div class="pmeta">−${fmt(l.lineDiscount)} off</div>` : ''}</div>
      <div class="line-actions">
        <div class="stepper"><button data-dec="${i}" aria-label="One less">−</button><span class="num">${l.qty}</span><button data-inc="${i}" aria-label="One more">+</button></div>
        <button class="link" data-disc="${i}">${l.lineDiscount ? 'Change discount' : 'Discount'}</button>
        <button class="link danger" data-rm="${i}">Remove</button>
      </div></div>`;
  }).join('') || '<div class="empty">The bill is empty. Go back and tap a size to add it.</div>';
  $('payModes').innerHTML = ['UPI', 'Cash', 'Card', 'Credit'].map(m =>
    `<button aria-pressed="${m === S.payMode}" data-mode="${m}">${m}</button>`).join('');
  renderTotals();
}
function renderTotals(){
  const t = cartTotals();
  $('totals').innerHTML = `<div><span>Items (${t.pcs} pcs)</span><span>${fmt(t.sub)}</span></div>` +
    (t.bd ? `<div><span>Bill discount</span><span>−${fmt(t.bd)}</span></div>` : '') +
    `<div class="grand"><span>To collect</span><span>${fmt(t.total)}</span></div>`;
  $('cbTotal').textContent = fmt(t.total);
  $('completeBtn').disabled = !S.cart.length || t.total < 0;
  renderBillBar();
}
$('lines').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.inc) { const l = S.cart[d.inc]; if (!addToCart(l.sku, true)) return; }
  if (d.dec) { const l = S.cart[d.dec]; l.qty--; if (l.qty < 1) S.cart.splice(d.dec, 1); }
  if (d.rm)  S.cart.splice(d.rm, 1);
  if (d.disc) {
    const l = S.cart[d.disc], max = S.bySku[l.sku].price * l.qty;
    const v = prompt(`Discount in ₹ for this line (max ${fmt(max)})`, l.lineDiscount || '');
    if (v === null) return;
    const n = Number(v); if (!(n >= 0 && n <= max)) return toast('Enter an amount between 0 and ' + fmt(max), true);
    l.lineDiscount = n;
  }
  renderBill();
};
$('payModes').onclick = e => { const b = e.target.closest('[data-mode]'); if (!b) return; S.payMode = b.dataset.mode; renderBill(); };
$('billDisc').addEventListener('input', renderTotals);

$('completeBtn').onclick = async () => {
  const t = cartTotals();
  if (!S.cart.length) return;
  if (t.bd > t.sub) return toast('Bill discount is more than the bill.', true);
  S.clientId = S.clientId || (Date.now().toString(36) + Math.random().toString(36).slice(2));
  show('busy', true);
  try {
    const r = await call('submitSale', S.token, {
      clientId: S.clientId, items: S.cart, billDiscount: t.bd, paymentMode: S.payMode,
      customerName: $('custName').value.trim(), customerPhone: $('custPhone').value.trim(),
    });
    resetBill();
    show('vBill', false);
    showReceipt(r, true);
    loadCatalog().catch(() => {});
  } catch(e){ toast(e.message || 'Could not save the bill. Check the connection and tap Complete sale again.', true); }
  show('busy', false);
};
function resetBill(){
  S.cart = []; S.clientId = null; S.payMode = 'UPI';
  $('billDisc').value = ''; $('custName').value = ''; $('custPhone').value = '';
  renderBillBar(); renderList();
}

function showReceipt(r, fresh){
  S.lastReceipt = r;
  $('rcptTitle').textContent = fresh ? 'Bill saved' : r.saleId;
  const sub = r.items.reduce((s, i) => s + Number(i.lineTotal), 0);
  $('receipt').innerHTML = `
    <h3>${esc(r.shop.name)}</h3>
    <div class="c">${esc(r.shop.addressLine)}<br>${esc(r.shop.phone)}</div><hr>
    <div class="row sub"><span>${esc(r.saleId)}</span><span>${esc(r.dateTime)}</span></div>
    ${r.customerName ? `<div class="sub">Customer: ${esc(r.customerName)}</div>` : ''}<hr>
    ${r.items.map(i => `<div class="row"><span>${esc(i.name)}</span><span>${fmt(i.lineTotal)}</span></div>
      <div class="sub">${esc(i.colour)} ${esc(i.size)} · ${i.qty} × ${fmt(i.price)}${Number(i.lineDiscount) ? ' − ' + fmt(i.lineDiscount) : ''}</div>`).join('')}
    <hr>
    ${r.billDiscount ? `<div class="row"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      <div class="row"><span>Discount</span><span>−${fmt(r.billDiscount)}</span></div>` : ''}
    <div class="row big"><span>${r.total < 0 ? 'Refund' : 'Total'}</span><span>${fmt(Math.abs(r.total))}</span></div>
    <div class="row sub"><span>Paid by ${esc(r.paymentMode)}</span><span>Prices incl. GST</span></div><hr>
    <div class="c">${esc(r.shop.receiptFooter)}</div>`;
  $('waBtn').classList.toggle('hidden', !r.customerPhone);
  show('vReceipt', true);
}
$('printBtn').onclick = () => window.print();
$('waBtn').onclick = () => {
  const r = S.lastReceipt; if (!r) return;
  let ph = r.customerPhone.replace(/[^0-9]/g, '');
  if (ph.length === 10) ph = r.shop.whatsappCountryCode + ph;
  const lines = r.items.map(i => `${i.name} (${i.colour} ${i.size}) x${i.qty}: ${fmt(i.lineTotal)}`);
  const text = [r.shop.name, `Bill ${r.saleId} · ${r.dateTime}`, '', ...lines,
    ...(r.billDiscount ? [`Discount: −${fmt(r.billDiscount)}`] : []),
    '', `Total: ${fmt(r.total)} (${r.paymentMode})`, r.shop.receiptFooter].join(NL);
  window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(text), '_blank');
};
$('newSaleBtn').onclick = $('rcptBack').onclick = () => { show('vReceipt', false); $('q').focus(); };

function setTab(today){
  $('tabSell').setAttribute('aria-selected', !today); $('tabToday').setAttribute('aria-selected', today);
  show('vSell', !today); show('vToday', today); show('billbar', !today);
  if (today) loadToday();
}
$('tabSell').onclick = () => setTab(false);
$('tabToday').onclick = () => setTab(true);

async function loadToday(){
  $('vToday').innerHTML = '<div class="empty">Loading today’s bills…</div>';
  try {
    const d = await call('getTodaySummary', S.token);
    $('vToday').innerHTML = `
      <div class="daytotal num"><div class="sub">${esc(d.scope)} · today</div>
        <div class="amt">${fmt(d.total)}</div><div class="sub">${d.count} bill${d.count === 1 ? '' : 's'}</div>
        <div class="modes">${Object.entries(d.byMode).map(([m, v]) => `<span>${esc(m)} ${fmt(v)}</span>`).join('')}</div></div>
      ${d.bills.map(b => `<button class="bill num" data-sale="${esc(b.saleId)}">
        <span><b>${esc(b.time)}</b> · ${esc(b.paymentMode)}<br><span class="pmeta">${esc(b.saleId)}${b.customerName ? ' · ' + esc(b.customerName) : ''}</span></span>
        <b class="${b.total < 0 ? 'neg' : ''}">${fmt(b.total)}</b></button>`).join('') ||
        '<div class="empty">No bills yet today. Switch to Sell to make the first one.</div>'}`;
  } catch(e){ $('vToday').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$('vToday').onclick = async e => {
  const b = e.target.closest('[data-sale]'); if (!b) return;
  try { showReceipt(await call('getReceipt', S.token, b.dataset.sale), false); } catch(err){ toast(err.message, true); }
};

let scanner = null, lastCode = '', lastAt = 0;
function loadScanner(){
  if (window.Html5Qrcode) return Promise.resolve();
  return new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    sc.onload = sc.onerror = () => res();
    document.head.appendChild(sc);
    setTimeout(res, 8000);
  });
}
$('scanBtn').onclick = async () => {
  show('vScan', true);
  $('scanMsg').textContent = 'Starting camera…';
  await loadScanner();
  if (typeof Html5Qrcode === 'undefined') { $('scanMsg').textContent = 'The scanner didn’t load. Type the barcode in the search box, or use a Bluetooth scanner.'; return; }
  try {
    scanner = scanner || new Html5Qrcode('scanner', { formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.QR_CODE ] });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } }, code => {
      const now = Date.now();
      if (code === lastCode && now - lastAt < 1500) return;
      lastCode = code; lastAt = now;
      const hit = S.byCode[code] || S.byCode[code.toUpperCase()];
      if (hit) { if (addToCart(hit.sku)) $('scanMsg').textContent = `Added ${hit.name} · ${hit.colour} ${hit.size}`; }
      else $('scanMsg').textContent = `No item with barcode ${code}. Check the Variants tab.`;
    });
  } catch(e){
    const denied = /NotAllowed|Permission/i.test(String(e && (e.name || e.message) || e));
    $('scanMsg').textContent = denied
      ? 'Camera permission is blocked for this site. Tap the lock or settings icon next to the address, allow Camera, then tap Scan again.'
      : 'Camera unavailable (' + (e.message || e) + '). Type the barcode in the search box, or use a Bluetooth scanner.';
  }
};
$('scanClose').onclick = async () => {
  if (scanner && scanner.isScanning) { try { await scanner.stop(); } catch(e){} }
  show('vScan', false);
};

const wedge = { buf: '', last: 0 };
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (el && el.id === 'q') return;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if (!S.token || $('app').classList.contains('hidden')) return;
  const now = Date.now();
  if (now - wedge.last > 60) wedge.buf = '';
  wedge.last = now;
  if (e.key === 'Enter') {
    const code = wedge.buf; wedge.buf = '';
    if (code.length >= 4) {
      const hit = S.byCode[code] || S.byCode[code.toUpperCase()];
      if (hit) addToCart(hit.sku); else toast('No item with barcode ' + code, true);
      e.preventDefault();
    }
  } else if (e.key.length === 1) {
    wedge.buf += e.key;
  }
});

boot().catch(e => showFatal('Startup failed: ' + (e.message || e)));
</script>
</body>
